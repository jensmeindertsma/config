$font = JetBrainsMono Nerd Font Mono ExtraBold

general {
    hide_cursor = true
}

animations {
    enabled = false
}

background {
    monitor =
    path = $HOME/pictures/wallpapers/orange-snow.jpg
    blur_passes = 0
}

input-field {
    monitor =
    size = 15%, 4%
    outline_thickness = 6
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(ffffffff)
    check_color = rgba(ffffffff)
    fail_color = rgba(ff0000ff)
    rounding = 0

    font_color = rgba(ffffffff)
    fade_on_empty = true
    font_family = $font
    placeholder_text = AUTHENTICATE
    fail_text = $PAMFAIL$FPRINTFAIL

    # uncomment if you wish to display a message during authentication
    # check_text = Authenticating...

    # uncomment to use a letter instead of a dot to indicate the typed password
    dots_text_format = 
    # dots_size = 0.4
    dots_spacing = 0.6

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, 60
    halign = center
    valign = bottom
}
